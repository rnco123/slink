# Deploy — build the storefront + medusa images, push to GHCR, then roll Railway.
#
# FULLY AUTOMATIC. Every push to `main` (i.e. every merged PR) rebuilds the two
# images and redeploys the Railway services:
#
#   • `images`  builds + pushes to GHCR on a GitHub-hosted runner.
#   • `deploy`  calls the Railway API with a project token. No self-hosted
#     runner, no SSH, no box to keep alive — Railway pulls the new image.
#
# Railway service sources point at the GHCR `:latest` tags, so `railway redeploy`
# pulls the image this workflow just pushed. Rollback is Railway's deployment
# history (Deployments → ⋯ → Redeploy), not a tag change.
#
# DB migrations and the content/catalog/artwork sync are NOT run from here. They
# are the medusa service's **Pre-Deploy Command** in Railway, so they run inside
# the container with the service's own variables, once per deploy, before the new
# version takes traffic. See docs/DEPLOYMENT.md § Pre-deploy for the exact string.
#
# `main` is protected (CI required before merge), so whatever lands here is already
# green. Use the "Run workflow" button for a manual redeploy.
#
# Required repo secrets/variables:
#   secrets.RAILWAY_TOKEN                     Railway **project** token
#   vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY   set once prod is seeded
name: deploy

on:
  # Deploy only AFTER ci has actually gone green on main. Previously this ran on
  # every push regardless of CI, so a red build still reached production.
  #
  # Gated on `ci` ONLY — that is the correctness gate (format, lint, typecheck,
  # build, unit + integration tests). Deliberately NOT gated on security /
  # meta-lint / knip / lighthouse: those fail on upstream advisories and tooling
  # config (a stranger publishing a CVE in a transitive dep, a linter not knowing
  # a runner label), and must never block shipping a working site. They still run
  # and still report — they just aren't a deploy blocker.
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  # Manual escape hatch: redeploy/roll back without waiting on CI.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never roll two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: rnco123

jobs:
  images:
    name: build + push images
    runs-on: ubuntu-latest
    # workflow_run fires on ANY ci completion, including failures — so only
    # proceed when it actually succeeded. Manual dispatch always proceeds.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Under workflow_run, checkout defaults to the default branch HEAD, which
      # is not necessarily the commit CI just validated. Pin to that exact commit
      # so we ship what actually passed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Medusa image -----------------------------------------------------
      # MEDUSA_BACKEND_URL is baked into the admin bundle at build time (see the
      # Dockerfile). It MUST be the public admin origin, or the deployed admin
      # calls http://localhost:9000 in the browser and login is refused.
      - name: Build + push medusa
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            MEDUSA_BACKEND_URL=https://manage.saludlinkusa.com
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/slink-medusa:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/slink-medusa:${{ github.event.workflow_run.head_sha || github.sha }}
          # Cache lives in GHCR (a `:buildcache` tag), NOT GitHub's cache service:
          # the GHA cache is capped at 10GB/repo, and two images at mode=max blew
          # past it — layers were evicted between deploys, so builds ran cold and
          # `npm install`/`pnpm install` reran every time. GHCR has no such cap.
          # mode=max caches intermediate stages (deps/build), not just the final.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/slink-medusa:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/slink-medusa:buildcache,mode=max

      # --- Storefront image (NEXT_PUBLIC_* are build args, baked into bundle) -
      - name: Build + push storefront
        uses: docker/build-push-action@v6
        with:
          context: .
          file: storefront/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY || 'pk_replace_after_seed' }}
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://manage.saludlinkusa.com
            NEXT_PUBLIC_BASE_URL=https://saludlinkusa.com
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/slink-storefront:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/slink-storefront:${{ github.event.workflow_run.head_sha || github.sha }}
          # Registry cache, same rationale as the medusa build above.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/slink-storefront:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/slink-storefront:buildcache,mode=max

  # ---------------------------------------------------------------------------
  # Roll Railway. Runs on a GitHub-hosted runner and talks to the Railway API
  # with a project token — nothing is installed on, or reachable in, our infra.
  #
  # Order matters: medusa first (its Pre-Deploy Command applies DB migrations and
  # syncs content/catalog/artwork), then worker and storefront against the
  # already-migrated schema.
  # ---------------------------------------------------------------------------
  deploy:
    name: roll railway
    needs: [images]
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Redeploy pulls the `:latest` GHCR image the `images` job just pushed.
      # `--yes` skips the interactive confirmation; without it the CLI hangs.
      - name: Redeploy medusa (runs migrations via Pre-Deploy Command)
        run: railway redeploy --service medusa --yes

      - name: Health check (fail the deploy if the API doesn't come up)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://manage.saludlinkusa.com/health || true)
            if [ "$code" = "200" ]; then
              echo "✅ medusa healthy (HTTP 200)"
              exit 0
            fi
            echo "waiting for medusa to come up… ($i/60, last=$code)"
            sleep 5
          done
          echo "❌ medusa did not return 200 within 300s"
          exit 1

      - name: Redeploy worker
        run: railway redeploy --service worker --yes

      - name: Redeploy storefront
        run: railway redeploy --service storefront --yes

      - name: Health check storefront
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://saludlinkusa.com/api/health || true)
            if [ "$code" = "200" ]; then
              echo "✅ storefront healthy (HTTP 200)"
              exit 0
            fi
            echo "waiting for storefront to come up… ($i/60, last=$code)"
            sleep 5
          done
          echo "❌ storefront did not return 200 within 300s"
          exit 1
