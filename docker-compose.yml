name: saludlink

# Note: In local dev, docker-compose provides a local Postgres 16 instance.
# To connect to Supabase Cloud or a local Supabase CLI instance (port 54322),
# set DATABASE_URL in backend/.env to your Supabase connection string.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: saludlink
      POSTGRES_PASSWORD: saludlink_local
      POSTGRES_DB: medusa
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saludlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
